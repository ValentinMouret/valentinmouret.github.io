<!-- ── Sky engine — Ciel vivant ──────────────────────────────────────
     Runs immediately (non-module) so CSS vars are set before first paint.
     The sky gradient tracks the device clock, updating every 60 seconds.
     Source of truth: DESIGN.md § Color System — Ciel vivant
     ──────────────────────────────────────────────────────────────── -->
<script>
(function () {
  // [hour, bgTop, bgBot, surface, surfaceRaised, text, textMuted, primary, navBg, border]
  var SKY = [
    [0,  '#050510','#120028','rgba(20,10,50,0.55)',  'rgba(40,20,80,0.40)',  '#E8E0FF','#9090BB','#A78BFA','rgba(8,4,28,0.94)',    'rgba(255,255,255,0.08)'],
    [4,  '#060614','#0E1A30','rgba(15,20,50,0.55)',  'rgba(30,35,80,0.40)',  '#D0E8FF','#7090AA','#60B0E0','rgba(6,10,24,0.94)',   'rgba(255,255,255,0.08)'],
    [5,  '#0E0D1E','#161428','rgba(20,16,45,0.60)',  'rgba(35,28,70,0.45)',  '#C0D0F0','#7888AA','#80A8E0','rgba(8,7,18,0.96)',    'rgba(255,255,255,0.09)'],
    [6,  '#FF9B5E','#FFD090','rgba(255,200,130,0.50)','rgba(220,160,80,0.40)','#3D1800','#7A4020','#E85C00','rgba(255,220,170,0.94)','rgba(0,0,0,0.07)'],
    [8,  '#FFD6A5','#FFF0DC','rgba(255,255,255,0.55)','rgba(0,0,0,0.05)',    '#1A1208','#8A7A62','#E87A00','rgba(255,248,235,0.94)','rgba(0,0,0,0.07)'],
    [12, '#FFF7E6','#FFFBF4','rgba(255,255,255,0.60)','rgba(0,0,0,0.05)',    '#111008','#887060','#CC6A00','rgba(255,252,244,0.94)','rgba(0,0,0,0.06)'],
    [16, '#FFE5B4','#FFD580','rgba(255,240,200,0.55)','rgba(0,0,0,0.05)',    '#2A1600','#8A6030','#D06800','rgba(255,235,180,0.94)','rgba(0,0,0,0.07)'],
    [17, '#C84418','#8E1840','rgba(90,15,35,0.58)',   'rgba(120,20,40,0.45)','#FFF0E8','#FFBC98','#FFD848','rgba(65,8,18,0.96)',   'rgba(255,255,255,0.08)'],
    [18, '#B02C0C','#721036','rgba(60,8,24,0.65)',    'rgba(80,10,30,0.50)', '#FFE8DC','#FFA888','#FFCC40','rgba(42,4,14,0.96)',   'rgba(255,255,255,0.09)'],
    [19, '#FF7B4E','#C0327A','rgba(18,4,10,0.68)',    'rgba(30,6,16,0.55)',  '#FFE8F0','#FFAAC8','#FFE060','rgba(60,10,30,0.94)',  'rgba(255,255,255,0.08)'],
    [21, '#2D1B69','#0B0033','rgba(50,20,100,0.50)',  'rgba(70,28,120,0.40)','#F0E8FF','#9080CC','#A78BFA','rgba(18,6,40,0.94)',   'rgba(255,255,255,0.08)'],
    [23, '#0F0820','#050510','rgba(20,10,40,0.55)',   'rgba(35,18,60,0.40)', '#E8E0FF','#8080AA','#A78BFA','rgba(6,4,18,0.94)',    'rgba(255,255,255,0.08)'],
  ];

  var TOKENS = [
    '--bg-top','--bg-bot','--surface','--surface-raised',
    '--text','--text-muted','--primary','--nav-bg','--border'
  ];

  function lerp(a, b, t) { return a + (b - a) * t; }

  function lerpColor(c1, c2, t) {
    function hex(h) { return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
    function rgba(s) { var m = s.match(/rgba?\(([^)]+)\)/); return m ? m[1].split(',').map(Number) : null; }
    if (c1.charAt(0) === '#' && c2.charAt(0) === '#') {
      var a = hex(c1), b2 = hex(c2);
      return 'rgb('+[0,1,2].map(function(i){return Math.round(lerp(a[i],b2[i],t));}).join(',')+')';
    }
    var a1 = rgba(c1), a2 = rgba(c2);
    if (a1 && a2) {
      return 'rgba('+a1.map(function(v,i){
        return i < 3 ? Math.round(lerp(v,a2[i],t)) : +lerp(v,a2[i],t).toFixed(2);
      }).join(',')+')';
    }
    return c1;
  }

  function getSky(h) {
    var prev = SKY[SKY.length - 1], next = SKY[0];
    for (var i = 0; i < SKY.length; i++) {
      if (SKY[i][0] <= h) prev = SKY[i];
      if (SKY[i][0] > h)  { next = SKY[i]; break; }
    }
    var span = next[0] > prev[0] ? next[0] - prev[0] : 24 - prev[0] + next[0];
    var elapsed = h >= prev[0] ? h - prev[0] : 24 - prev[0] + h;
    var t = span > 0 ? elapsed / span : 0;
    return prev.map(function(v, i) { return i === 0 ? h : lerpColor(String(v), String(next[i]), t); });
  }

  function applyTheme(h) {
    var sky = getSky(h);
    var root = document.documentElement;
    TOKENS.forEach(function(tok, i) { root.style.setProperty(tok, sky[i + 1]); });
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.content = sky[1];
  }

  function tick() { var d = new Date(); applyTheme(d.getHours() + d.getMinutes() / 60); }
  tick();
  setInterval(tick, 60000);
})();
</script>
